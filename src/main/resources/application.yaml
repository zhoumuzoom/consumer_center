spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${mysql.username}
    password: ${mysql.password}

  # Spring AI：OpenAI 兼容网关
  ai:
    openai:
      base-url: ${AI_GATEWAY_BASE_URL:https://nowcoding.ai}
      api-key: ${AI_GATEWAY_API_KEY:unset}
      chat:
        options:
          model: ${AI_GATEWAY_MODEL:gpt-6.2-sol}
    retry:
      max-attempts: 2
      on-client-errors: false

  http:
    client:
      connect-timeout: 10s
      read-timeout: 120s

  # AI 流式对话为长连接，放宽 MVC 异步请求超时
  mvc:
    async:
      request-timeout: 180s

# AI 能力配置
ai:
  insight:
    task-ttl-hours: 2
    lock-ttl-seconds: 180
  copilot:
    memory-max-messages: 20
    memory-ttl-hours: 24

# MyBatis配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.iwhalecloud.consumercenter.mvc.controller
# Knife4j增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表

# sa-token认证配置
sa-token:
  # token名称（同时是请求头名称）
  token-name: token
  # 全局默认有效期（秒），登录时按会话单独指定
  timeout: 2592000
  # 全局最低活跃频率（秒），-1代表不限制，按会话单独指定
  active-timeout: -1
  # 启用动态active-timeout（允许每个会话单独设置activeTimeout）
  dynamic-active-timeout: true
  # 同一账号允许并发登录（access与refresh双会话共存）
  is-concurrent: true
  # 每次登录生成独立token
  is-share: false
  # token风格
  token-style: uuid
  # 前后端分离，不读写Cookie，仅从请求头读取
  is-read-cookie: false
  # 是否输出操作日志
  is-log: false

# OAuth2 SSO配置。关闭时不影响本地账号密码登录。
sso:
  oauth2:
    enabled: ${SSO_OAUTH2_ENABLED:false}
    introspection-uri: ${SSO_OAUTH2_INTROSPECTION_URI:}
    client-id: ${SSO_OAUTH2_CLIENT_ID:}
    client-secret: ${SSO_OAUTH2_CLIENT_SECRET:}
    external-id-field: ${SSO_OAUTH2_EXTERNAL_ID_FIELD:sub}
    source: ${SSO_OAUTH2_SOURCE:portal}