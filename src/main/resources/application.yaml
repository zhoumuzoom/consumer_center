spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${mysql.username}
    password: ${mysql.password}

# MyBatis配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.iwhalecloud.consumercenter.mvc.controller
# Knife4j增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表

# sa-token认证配置
sa-token:
  # token名称（同时是请求头名称）
  token-name: token
  # 全局默认有效期（秒），登录时按会话单独指定
  timeout: 2592000
  # 全局最低活跃频率（秒），-1代表不限制，按会话单独指定
  active-timeout: -1
  # 启用动态active-timeout（允许每个会话单独设置activeTimeout）
  dynamic-active-timeout: true
  # 同一账号允许并发登录（access与refresh双会话共存）
  is-concurrent: true
  # 每次登录生成独立token
  is-share: false
  # token风格
  token-style: uuid
  # 前后端分离，不读写Cookie，仅从请求头读取
  is-read-cookie: false
  # 是否输出操作日志
  is-log: false

# OAuth2 SSO配置。关闭时不影响本地账号密码登录。
sso:
  oauth2:
    enabled: ${SSO_OAUTH2_ENABLED:false}
    introspection-uri: ${SSO_OAUTH2_INTROSPECTION_URI:}
    client-id: ${SSO_OAUTH2_CLIENT_ID:}
    client-secret: ${SSO_OAUTH2_CLIENT_SECRET:}
    external-id-field: ${SSO_OAUTH2_EXTERNAL_ID_FIELD:sub}
    source: ${SSO_OAUTH2_SOURCE:portal}